<h1>任務追蹤 Task Tracker</h1>
<p class="sub">在自己電腦上執行的個人任務追蹤工具</p>

<p>任務追蹤會把使用者在 GitHub 上的 Issue、Pull Request,以及 Google 試算表中指派給自己的項目,集中顯示在一個只在本機執行的網頁裡,並提供週表與報表匯出。</p>

<ul>
  <li>工具在使用者自己的電腦上執行,沒有雲端伺服器。</li>
  <li>Google 試算表只以<strong>唯讀</strong>權限讀取,不會修改任何試算表內容。</li>
  <li>使用者自己記錄的狀態、日期與備註,只存在使用者自己的電腦上。</li>
</ul>

<p><a href="privacy.html">隱私權政策</a></p>
